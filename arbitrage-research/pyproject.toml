[project]
name = "arbitrage-research"
version = "0.1.0"
description = "Prediction-market arbitrage data contracts, replay, and backtesting tools."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "websockets>=15.0",
    "python-socks[asyncio]>=2.4",
    "pyarrow>=16.0",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
analytics = [
  "duckdb>=1.0",
  "polars>=1.0",
  "pyarrow>=16.0",
]
connectors = [
  "httpx>=0.27",
  "websockets>=15.0",
]
dev = [
  "pytest>=8.0",
  "numpy>=1.26",
]

[project.scripts]
arb-research = "arb_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
