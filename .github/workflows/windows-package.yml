name: Windows portable package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            tools/windows/requirements.txt
            tools/windows/requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r tools/windows/requirements-test.txt
          python -m pip install --no-deps -e arbitrage-research -e arbitrage-live -e arbitrage-realtime
      - name: Test portable storage, strategy regressions and launcher
        run: >-
          python -m pytest -q --import-mode=importlib tools/windows/tests
          arbitrage-research/tests/test_market_clock.py
          arbitrage-research/tests/test_monitor_hot_path.py
          arbitrage-research/tests/test_candidate_paper.py
          arbitrage-research/tests/test_candidate_observations.py
          arbitrage-research/tests/test_log_storage.py
          arbitrage-research/tests/test_live_strategy_monitor.py
          arbitrage-research/tests/test_candidate_stress.py
          arbitrage-research/tests/test_orderbook_depth.py
          arbitrage-research/tests/test_dashboard.py
          arbitrage-live/tests/test_settings.py
          arbitrage-live/tests/test_dashboard.py
          arbitrage-live/tests/test_runner.py
          arbitrage-realtime/tests
      - name: Test Gate parser without browser dependencies
        run: node --test arbitrage-research/tests/node/gate_low_frequency_monitor.test.mjs
      - name: Build optimized portable collector runtime
        run: python tools/windows/build.py --output dist/windows
      - name: Test relocated portable package on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relocatedApp = Join-Path $env:RUNNER_TEMP 'Arbitrage Design 中文'
          Move-Item -LiteralPath dist/windows/ArbitrageDesign -Destination $relocatedApp
          python tools/windows/smoke_test.py "$relocatedApp"
      - name: Test automatic setup without an installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $relocatedApp = Join-Path $env:RUNNER_TEMP 'Arbitrage Design 中文'
          python tools/windows/bootstrap_smoke_test.py "$relocatedApp"
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ArbitrageDesign-Windows-x64
          path: |
            dist/windows/ArbitrageDesign-Windows-x64.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Windows download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shortCommit = $env:GITHUB_SHA.Substring(0, 7)
          $releaseTag = "windows-$env:GITHUB_RUN_NUMBER-$shortCommit"
          gh release create $releaseTag dist/windows/ArbitrageDesign-Windows-x64.zip dist/windows/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Windows portable - $shortCommit" --notes-file tools/windows/release-notes.md --latest
