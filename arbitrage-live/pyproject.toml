[project]
name = "polymarket-btc-live-safety"
version = "0.1.0"
description = "Observe/canary safety skeleton for Polymarket BTC 5-minute DOWN execution"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = [
  "py-clob-client-v2>=1.0.1",
  "websockets>=12.0",
  "eth-account>=0.13.0",
]

[project.scripts]
polymarket-live = "live_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
